name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if frontend exists
        id: check
        run: test -f frontend/package.json && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: cd frontend && npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: cd frontend && npm run lint --if-present
      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: cd frontend && npm test --if-present -- --watch=false

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if backend exists
        id: check
        run: test -f backend/go.mod && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT
      - uses: actions/setup-go@v5
        if: steps.check.outputs.exists == 'true'
        with:
          go-version: '1.22'
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: cd backend && go vet ./...
      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: cd backend && go test ./...

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: circl_user
          POSTGRES_PASSWORD: circl_password
          POSTGRES_DB: circl_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Check if backend exists
        id: check
        run: test -f backend/go.mod && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT
      - uses: actions/setup-go@v5
        if: steps.check.outputs.exists == 'true'
        with:
          go-version: '1.22'
      - name: Run migrations
        if: steps.check.outputs.exists == 'true'
        run: |
          cd backend && go build -o /tmp/circl-api ./cmd/api
          DATABASE_URL="postgres://circl_user:circl_password@localhost:5432/circl_db?sslmode=disable" \
          REDIS_URL="redis://localhost:6379/0" \
          ASYNQ_REDIS_URL="redis://localhost:6379/1" \
          JWT_SECRET="integration-test-jwt-secret-32chars!!" \
          STORAGE_PROVIDER="local" \
          CORS_ALLOWED_ORIGINS="http://localhost" \
          /tmp/circl-api &
          timeout 30 bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'
          kill %1 || true
      - name: Integration tests
        if: steps.check.outputs.exists == 'true'
        run: cd backend && go test ./...
        env:
          TEST_DATABASE_URL: postgres://circl_user:circl_password@localhost:5432/circl_db?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/2

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: circl_user
          POSTGRES_PASSWORD: circl_password
          POSTGRES_DB: circl_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Build and start backend
        run: |
          cd backend && go build -o ../api-server ./cmd/api
      - name: Run backend and E2E tests
        run: |
          DATABASE_URL="postgres://circl_user:circl_password@localhost:5432/circl_db?sslmode=disable" \
          REDIS_URL="redis://localhost:6379/0" \
          ASYNQ_REDIS_URL="redis://localhost:6379/1" \
          JWT_SECRET="e2e-test-jwt-secret-minimum-32characters!" \
          STORAGE_PROVIDER="local" \
          CORS_ALLOWED_ORIGINS="http://localhost:3000" \
          LOGIN_IP_LIMIT=1000 \
          REGISTER_IP_LIMIT=1000 \
          ../api-server &
          timeout 30 bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'
          cd frontend && npm run test:e2e
        env:
          CI: 'true'
          NEXTAUTH_URL: 'http://localhost:3000'
          NEXTAUTH_SECRET: 'e2e-test-secret-for-playwright-32chars!'
          BACKEND_URL: 'http://localhost:8080'
          NEXT_PUBLIC_API_URL: 'http://localhost:8080'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7