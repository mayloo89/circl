name: CI

on:
  push:
  pull_request:
  # Manual runs also exercise publish-images from any branch (images get the
  # sanitized branch-name tag) — lets the publish pipeline be verified before
  # a change to it lands on develop.
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml --format=stylish

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if frontend exists
        id: check
        run: test -f frontend/package.json && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: cd frontend && npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: cd frontend && npm run lint --if-present
      - name: Test (coverage gate)
        if: steps.check.outputs.exists == 'true'
        run: cd frontend && npm run test:coverage --if-present

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if backend exists
        id: check
        run: test -f backend/go.mod && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT
      - uses: actions/setup-go@v5
        if: steps.check.outputs.exists == 'true'
        with:
          go-version: '1.25'
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: cd backend && go vet ./...
      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: cd backend && go test ./...

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: circl_user
          POSTGRES_PASSWORD: circl_password
          POSTGRES_DB: circl_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Check if backend exists
        id: check
        run: test -f backend/go.mod && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT
      - uses: actions/setup-go@v5
        if: steps.check.outputs.exists == 'true'
        with:
          go-version: '1.25'
      - name: Run migrations
        if: steps.check.outputs.exists == 'true'
        run: |
          cd backend && go build -o /tmp/circl-api ./cmd/api
          DATABASE_URL="postgres://circl_user:circl_password@localhost:5432/circl_db?sslmode=disable" \
          REDIS_URL="redis://localhost:6379/0" \
          ASYNQ_REDIS_URL="redis://localhost:6379/1" \
          JWT_SECRET="integration-test-jwt-secret-32chars!!" \
          STORAGE_PROVIDER="local" \
          CORS_ALLOWED_ORIGINS="http://localhost" \
          /tmp/circl-api &
          timeout 30 bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'
          kill %1 || true
      - name: Integration tests
        if: steps.check.outputs.exists == 'true'
        run: cd backend && go test ./...
        env:
          TEST_DATABASE_URL: postgres://circl_user:circl_password@localhost:5432/circl_db?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/2

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: circl_user
          POSTGRES_PASSWORD: circl_password
          POSTGRES_DB: circl_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Build backend
        run: cd backend && go build -o /tmp/api-server ./cmd/api
      - name: Run backend and E2E tests
        run: |
          DATABASE_URL="postgres://circl_user:circl_password@localhost:5432/circl_db?sslmode=disable" \
          REDIS_URL="redis://localhost:6379/0" \
          ASYNQ_REDIS_URL="redis://localhost:6379/1" \
          JWT_SECRET="e2e-test-jwt-secret-minimum-32characters!" \
          STORAGE_PROVIDER="local" \
          CORS_ALLOWED_ORIGINS="http://localhost:3000" \
          LOGIN_IP_LIMIT=1000 \
          REGISTER_IP_LIMIT=1000 \
          TEST_ENDPOINTS_ENABLED=true \
          bash -c 'cd backend && exec /tmp/api-server' &
          timeout 30 bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'
          cd frontend && npm run test:e2e
        env:
          CI: 'true'
          NEXTAUTH_URL: 'http://localhost:3000'
          NEXTAUTH_SECRET: 'e2e-test-secret-for-playwright-32chars!'
          BACKEND_URL: 'http://localhost:8080'
          NEXT_PUBLIC_API_URL: 'http://localhost:8080'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Publishes linux/arm64 images to GHCR once the full pipeline is green on
  # develop or main. Production hosts pull these instead of building from
  # source on-device (15-25 min on a Raspberry Pi 5 becomes a pull).
  # Tags: the branch name (`develop` / `main`) plus the short commit SHA
  # (`sha-<hash>`) for pinning and rollback.
  publish-images:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    needs: [secret-scan, openapi-lint, frontend, backend, backend-integration, e2e]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            build_args: ''
          - image: frontend
            context: frontend
            # NEXT_PUBLIC_* values bake into the browser bundle at build time,
            # so the image is domain-specific. DEPLOY_DOMAIN (and optionally
            # NEXT_PUBLIC_TURNSTILE_SITE_KEY) come from repository variables;
            # when DEPLOY_DOMAIN is unset the frontend image is skipped.
            build_args: |
              NEXT_PUBLIC_API_URL=https://${{ vars.DEPLOY_DOMAIN }}/api
              NEXT_PUBLIC_WS_URL=wss://${{ vars.DEPLOY_DOMAIN }}/api
              NEXT_PUBLIC_IMAGE_HOSTNAME=${{ vars.DEPLOY_DOMAIN }}
              NEXT_PUBLIC_IMAGE_PROTOCOL=https
              NEXT_PUBLIC_IMAGE_UNOPTIMIZED=true
              NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          - image: moderation
            context: ops/moderation
            build_args: ''
    steps:
      - name: Decide whether this image can be built
        id: gate
        run: echo "build=${{ matrix.image != 'frontend' || vars.DEPLOY_DOMAIN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.gate.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: steps.gate.outputs.build == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.build == 'true'
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}