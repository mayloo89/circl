name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if frontend exists
        id: check
        run: test -f frontend/package.json && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: cd frontend && npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: cd frontend && npm run lint --if-present
      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: cd frontend && npm test --if-present -- --watch=false

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if backend exists
        id: check
        run: test -f backend/go.mod && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT
      - uses: actions/setup-go@v5
        if: steps.check.outputs.exists == 'true'
        with:
          go-version: '1.22'
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: cd backend && go vet ./...
      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: cd backend && go test ./...