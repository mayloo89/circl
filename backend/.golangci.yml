version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
        # S1016 rewrites explicit struct-literal mapping into a struct
        # conversion. We keep request DTOs and domain types as separate,
        # field-identical types on purpose — the wire contract must not be
        # coupled to the domain model's field order — so this mapping is
        # deliberate, not redundant.
        - -S1016
        # QF1001 applies De Morgan's law; rewriting the explicit hex-digit
        # bounds check reads worse than the original.
        - -QF1001
        # ST style checks disabled to match golangci-lint's own defaults —
        # package-comment / naming / var-comment-form conventions we don't
        # enforce project-wide.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      # Test teardown routinely ignores Close()/Exec() return values; a failed
      # teardown surfaces through the assertions that follow, so requiring the
      # check here is noise rather than safety.
      - path: _test\.go
        linters:
          - errcheck
