global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Receive remote-write from Tempo metrics generator.
# Enabled via --web.enable-remote-write-receiver CLI flag.

scrape_configs:
  - job_name: circl-backend
    # host.docker.internal resolves to the host on macOS/Windows Docker Desktop.
    # On Linux add: extra_hosts: ["host.docker.internal:host-gateway"] to the
    # prometheus service in docker-compose.yml, or use the host IP directly.
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
