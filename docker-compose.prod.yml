# Production compose — Raspberry Pi / YunoHost self-hosted deploy.
#
# Usage:
#   cp deploy/.env.prod.example .env.prod   # fill in secrets
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Architecture:
#   - Postgres and Redis have no exposed ports (internal Docker network only).
#   - Backend and frontend are bound to 127.0.0.1 — nginx (YunoHost) proxies them externally.
#   - Uploaded files are stored in a named Docker volume (local storage, no S3/minio needed).
#   - No observability stack (Grafana/Loki/Tempo/Prometheus) — too heavy for a Pi.
#     The backend auto-falls-back to a no-op exporter when OTEL_EXPORTER_OTLP_ENDPOINT is unset.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-circl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-circl_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-circl_user} -d ${POSTGRES_DB:-circl_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.prod
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads_data:/app/data
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the browser bundle at build time.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN}/api
        NEXT_PUBLIC_IMAGE_HOSTNAME: ${DOMAIN}
        NEXT_PUBLIC_IMAGE_PROTOCOL: https
    environment:
      # Server-side only — not exposed to browser.
      BACKEND_URL: http://backend:8080
      AUTH_URL: https://${DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
