# nginx reverse proxy config for Circl — YunoHost / Raspberry Pi deploy.
#
# SETUP:
#   1. Replace CIRCL_DOMAIN with your actual domain (e.g. circl.unlug.ar).
#   2. Run: yunohost domain add CIRCL_DOMAIN
#           yunohost domain cert install CIRCL_DOMAIN
#   3. Copy this file: cp circl.conf /etc/nginx/conf.d/CIRCL_DOMAIN.conf
#      (Replaces the YunoHost-generated config for this domain.)
#   4. nginx -t && systemctl reload nginx
#
# SSL certs are managed by YunoHost at /etc/yunohost/certs/CIRCL_DOMAIN/.
# When YunoHost renews the cert (auto via Let's Encrypt), this file is preserved
# because YunoHost only regenerates configs for its own apps, not custom files.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name CIRCL_DOMAIN;

    # SSL — managed by YunoHost Let's Encrypt
    ssl_certificate     /etc/yunohost/certs/CIRCL_DOMAIN/crt.pem;
    ssl_certificate_key /etc/yunohost/certs/CIRCL_DOMAIN/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/CIRCL_DOMAIN-access.log;
    error_log  /var/log/nginx/CIRCL_DOMAIN-error.log;

    # ── WebSockets (chat rooms + public channels) ──────────────────────────
    # Must come before the general /api/ block (nginx uses longest/most-specific match).
    location ~ ^/api/(chat/rooms/[^/]+/ws|chat/channels/[^/]+/ws)$ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SSE — notification stream (keep-alive, no buffering) ───────────────
    location /api/notifications/stream {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── REST API ────────────────────────────────────────────────────────────
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 20M;
    }

    # ── Next.js frontend ────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name CIRCL_DOMAIN;
    return 301 https://$host$request_uri;
}
