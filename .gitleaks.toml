title = "Gitleaks configuration for Circl"

[allowlist]
description = "Files that intentionally contain non-production placeholder credentials"
paths = [
  # CI workflow: JWT/NextAuth values are ephemeral test-only secrets.
  '''.github/workflows/ci\.yml''',
  # Example env files: placeholders, never real credentials.
  '''backend/\.env\.example''',
  '''frontend/\.env\.example''',
  # docker-compose: local dev passwords (circl_password, minioadmin, etc.).
  '''docker-compose\.yml''',
]
