# Generic production compose for Circl.
#
# Copy this file (and the matching .env.prod.example) into a local,
# gitignored `deploy/` folder and customise for your host:
#
#   mkdir -p deploy
#   cp docs/deploy/docker-compose.prod.yml deploy/
#   cp docs/deploy/.env.prod.example       deploy/.env.prod
#   cp docs/deploy/update.sh               deploy/
#
# The app services (backend, frontend, moderation) carry both `image:` and
# `build:`. CI publishes linux/arm64 images to GHCR on every green push to
# develop/main, so the normal flow is pull-based — `deploy/update.sh` pulls
# and never compiles on the arm64 host. The `build:` block stays as a
# from-source fallback: update.sh pulls with --ignore-pull-failures, so on
# amd64 (or when an image isn't published) the un-pulled services are built
# by `compose up` instead of the update aborting. The GHCR `image:` defaults
# are therefore safe on every host — they just decide pull-vs-build, not
# success-vs-failure. Pin a specific build for rollback via BACKEND_IMAGE /
# FRONTEND_IMAGE / MODERATION_IMAGE in .env.prod, e.g.
# BACKEND_IMAGE=ghcr.io/mayloo89/circl-backend:sha-<hash>.
#
# Note the frontend image bakes NEXT_PUBLIC_* values (domain!) at build
# time — the published image targets the domain set in the repo's
# DEPLOY_DOMAIN Actions variable. Forks and other domains must build from
# source or publish their own image.
#
# Architecture:
#   - postgres and redis have no exposed ports (internal docker network only).
#   - backend and frontend bind to 127.0.0.1 so the host's reverse proxy is
#     the only entry point. Adjust if you proxy from another host.
#   - moderation (NudeNet sidecar) is reached at http://moderation:8000.
#     If you don't run it, leave MODERATION_API_URL unset in .env.prod and
#     comment out the service block + the `depends_on: moderation` clause
#     below — the backend falls back to a NoopClassifier.
#   - Uploads live in a named volume (`uploads_data`) and are served by the
#     backend at /uploads/files/. No S3 needed for a single-host deploy.
#   - No observability stack here — too heavy for many deploys. The backend
#     auto-falls-back to a no-op exporter when OTEL_EXPORTER_OTLP_ENDPOINT
#     is unset.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-circl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-circl_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-circl_user} -d ${POSTGRES_DB:-circl_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Automated Postgres backups — scheduled pg_dump with daily/weekly/monthly
  # rotation, gzip-compressed into the db_backups volume. The image keeps a
  # `last/<db>-latest.sql.gz` pointer used by restore-drill.sh. Restore and
  # drill procedures: docs/runbooks/db-backup-restore.md.
  backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-circl_db}
      POSTGRES_USER: ${POSTGRES_USER:-circl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # --no-owner/--no-acl so a dump restores cleanly under any role.
      POSTGRES_EXTRA_OPTS: "--no-owner --no-acl"
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      # Take a backup at container start so a fresh deploy is covered before
      # the first scheduled run.
      BACKUP_ON_START: "TRUE"
    volumes:
      - db_backups:/backups

  # Optional off-site backup sync to any S3-compatible target (AWS S3,
  # Cloudflare R2, MinIO). Disabled by default — enable by setting
  # COMPOSE_PROFILES=offsite in .env.prod and filling the BACKUP_S3_* vars.
  # Without off-site copy, backups share the host's disk and die with it.
  backup-offsite:
    image: amazon/aws-cli:2
    profiles: ["offsite"]
    restart: always
    depends_on:
      - backup
    volumes:
      - db_backups:/backups:ro
    environment:
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_SYNC_INTERVAL: ${BACKUP_S3_SYNC_INTERVAL:-86400}
    # $$ keeps the expansion at container runtime — compose must not resolve it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          aws s3 sync /backups "s3://$${BACKUP_S3_BUCKET}" --delete \
            $${BACKUP_S3_ENDPOINT:+--endpoint-url "$${BACKUP_S3_ENDPOINT}"} \
            || echo "off-site backup sync failed"
          sleep "$${BACKUP_S3_SYNC_INTERVAL}"
        done

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NSFW image-moderation sidecar (Python + FastAPI + NudeNet on ONNX).
  # The backend POSTs to http://moderation:8000/classify when
  # MODERATION_API_URL is set in .env.prod. The Dockerfile warms the model
  # cache at build time so the first request after `up -d --build` doesn't
  # pay the model-download cost. Remove this service if you don't want
  # automatic NSFW screening (leaving MODERATION_API_URL unset; the
  # hash-list + heuristic detectors still run).
  moderation:
    image: ${MODERATION_IMAGE:-ghcr.io/mayloo89/circl-moderation:develop}
    build: ../ops/moderation
    restart: always
    environment:
      LOG_LEVEL: WARNING
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/mayloo89/circl-backend:develop}
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ./.env.prod
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads_data:/app/data
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      moderation:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/mayloo89/circl-frontend:develop}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are baked into the browser bundle at build
        # time. A change to DOMAIN requires `up -d --build frontend`.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN}/api
        NEXT_PUBLIC_IMAGE_HOSTNAME: ${DOMAIN}
        NEXT_PUBLIC_IMAGE_PROTOCOL: https
        NEXT_PUBLIC_IMAGE_UNOPTIMIZED: "true"
        # Cloudflare Turnstile site key (anti-bot on guest entry). Blank disables
        # the widget. Baked at build time → a change needs `up -d --build frontend`.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    environment:
      BACKEND_URL: http://backend:8080
      AUTH_URL: https://${DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
      # Next.js v16 standalone binds to the value of HOSTNAME rather than
      # defaulting to 0.0.0.0. Without this it attaches to the container
      # ID hostname and the Dockerfile healthcheck never connects.
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    # Overrides the Dockerfile healthcheck (BusyBox wget against localhost,
    # which resolves to IPv6 ::1 first — but Next.js standalone only binds
    # to IPv4 0.0.0.0, so the loopback HTTP probe gets "Connection refused"
    # even though external traffic via the bridge works fine). Checking for
    # the next-server process is the reliable liveness signal here.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f next-server >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Observability stack (opt-in) ────────────────────────────────────────────
  # Loki (logs) + Alloy (log shipper) + Tempo (traces) + Prometheus (metrics) +
  # Grafana (UI). Disabled by default — it adds ~1 GB RAM, heavy for a small Pi.
  # Enable by setting COMPOSE_PROFILES=observability in .env.prod (along with
  # GRAFANA_ADMIN_PASSWORD, METRICS_TOKEN, and OTEL_EXPORTER_OTLP_ENDPOINT).
  # Only Grafana and Prometheus bind a host port, both on 127.0.0.1 — reach
  # them over an SSH tunnel; nothing here is public. See the deploy README.

  loki:
    image: grafana/loki:3.4.2
    profiles: ["observability"]
    restart: always
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ../ops/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.7.5
    profiles: ["observability"]
    restart: always
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ../ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.7.2
    profiles: ["observability"]
    restart: always
    command: -config.file=/etc/tempo/config.yaml
    volumes:
      - ../ops/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.3.1
    profiles: ["observability"]
    restart: always
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PROM_RETENTION: ${PROM_RETENTION:-7d}
    # Write the scrape bearer token from the env to a file (so the secret stays
    # in .env.prod, not in the committed config), then start Prometheus.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s' "$${METRICS_TOKEN}" > /prometheus/metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time="$${PROM_RETENTION}" \
          --web.enable-remote-write-receiver
    volumes:
      - ../ops/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ../ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    restart: always
    environment:
      # Real login — anonymous admin (the dev default) is never used in prod.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Set to https://grafana.${DOMAIN} (with serve_from_sub_path off) only if
      # you expose Grafana via the optional nginx subdomain. Blank = SSH tunnel.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ../ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  db_backups:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
