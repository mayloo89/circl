# Generic nginx reverse-proxy vhost for Circl.
#
#   sed -i 's/EXAMPLE_DOMAIN/your.domain.com/g' nginx.conf
#   sudo cp nginx.conf /etc/nginx/conf.d/your.domain.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust ssl_certificate* paths to point at your certificate manager
# (certbot lives at /etc/letsencrypt/live/<domain>/, control panels and
# the cloud-managed CAs each have their own location).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name EXAMPLE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/EXAMPLE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/EXAMPLE_DOMAIN/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/EXAMPLE_DOMAIN-access.log;
    error_log  /var/log/nginx/EXAMPLE_DOMAIN-error.log;

    # ── WebSocket upgrade (chat rooms, public channels) ─────────────────────
    location /api/ws {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # ── Backend API ─────────────────────────────────────────────────────────
    location /api/ {
        # Strip /api before forwarding so the backend sees the raw route.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Uploads — give the proxy enough time and headroom for image PUTs.
        client_max_body_size 50m;
        proxy_read_timeout   60s;
    }

    # ── Frontend (Next.js) ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Redirect plain HTTP → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name EXAMPLE_DOMAIN;
    return 301 https://$host$request_uri;
}
