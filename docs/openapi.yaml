openapi: "3.1.0"

info:
  title: Circl API
  version: "3.0.0"
  description: |
    REST + WebSocket API for the Circl real-time chat platform.

    **Authentication**: All protected endpoints require a Bearer JWT in the
    `Authorization` header obtained via `POST /auth/login`. Short-lived access
    tokens (15 min) are refreshed silently via `POST /auth/refresh` using the
    opaque refresh token returned at login.

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: invalid_credentials
        error:
          type: string
          description: Human-readable message.
          example: invalid credentials

    User:
      type: object
      required: [id, email, token]
      properties:
        id:          { type: string, format: uuid }
        email:       { type: string, format: email }
        token:       { type: string, description: Short-lived JWT (15 min). }
        refresh_token:
          type: string
          description: Opaque 7-day (remember_me) or 30-min refresh token.
        reactivated:
          type: boolean
          description: True when a previously soft-deleted account was restored.

    TokenPair:
      type: object
      required: [token, refresh_token]
      properties:
        token:         { type: string, description: New access JWT. }
        refresh_token: { type: string, description: New refresh token (rotated). }

    Profile:
      type: object
      properties:
        user_id:      { type: string, format: uuid }
        username:     { type: string }
        display_name: { type: string }
        bio:          { type: string }
        avatar_url:   { type: string, format: uri }
        date_of_birth:
          type: [string, "null"]
          format: date
        gender:       { type: string }
        interests:    { type: array, items: { type: string } }
        photos:
          type: array
          items:
            type: object
            properties:
              id:  { type: string, format: uuid }
              url: { type: string, format: uri }
        locale:       { type: string, example: en }
        push_enabled: { type: boolean }

    Room:
      type: object
      properties:
        id:           { type: string, format: uuid }
        type:         { type: string, enum: [dm, group, channel] }
        name:         { type: [string, "null"] }
        description:  { type: [string, "null"] }
        avatar_url:   { type: [string, "null"], format: uri }
        unread_count: { type: integer }
        last_message:
          type: [object, "null"]
          properties:
            content:    { type: string }
            created_at: { type: string, format: date-time }

    Message:
      type: object
      properties:
        id:           { type: string, format: uuid }
        room_id:      { type: string, format: uuid }
        sender_id:    { type: string, format: uuid }
        type:
          type: string
          enum: [text, image, video, file]
        content:      { type: string }
        file_url:     { type: [string, "null"], format: uri }
        thumbnail_url: { type: [string, "null"], format: uri }
        view_once:    { type: boolean }
        expires_at:   { type: [string, "null"], format: date-time }
        created_at:   { type: string, format: date-time }

    Contact:
      type: object
      properties:
        id:           { type: string, format: uuid }
        user_id:      { type: string, format: uuid }
        username:     { type: string }
        display_name: { type: string }
        avatar_url:   { type: [string, "null"], format: uri }
        status:       { type: string, enum: [pending, accepted, blocked] }

    UploadRequest:
      type: object
      required: [upload_id, upload_url]
      properties:
        upload_id:  { type: string, format: uuid }
        upload_url: { type: string, format: uri, description: Pre-signed PUT URL. }

    Report:
      type: object
      properties:
        id:                { type: string, format: uuid }
        reporter_id:       { type: string, format: uuid }
        reported_user_id:  { type: string, format: uuid }
        reported_email:    { type: string, format: email }
        reported_name:     { type: string }
        reported_avatar:   { type: string }
        reason:
          type: string
          enum:
            - harassment
            - spam
            - inappropriate_content
            - fake_profile
            - non_consensual_intimate_images
            - digital_gender_violence
            - csam
            - other
        priority:    { type: string, enum: [normal, high, critical] }
        description: { type: string }
        status:      { type: string, enum: [pending, reviewed, dismissed] }
        created_at:  { type: string, format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
        reviewed_by: { type: [string, "null"], format: uuid }

    Appeal:
      type: object
      properties:
        id:              { type: string, format: uuid }
        user_id:         { type: string, format: uuid }
        suspension_id:   { type: string, format: uuid }
        status:          { type: string, enum: [open, submitted, approved, denied, expired] }
        body:            { type: string }
        expires_at:      { type: string, format: date-time }
        submitted_at:    { type: [string, "null"], format: date-time }
        resolved_at:     { type: [string, "null"], format: date-time }
        resolved_by:     { type: [string, "null"], format: uuid }
        resolution_note: { type: string }
        created_at:      { type: string, format: date-time }

    AppealPublicView:
      type: object
      description: The un-authenticated view returned from `/appeal/{token}`.
      properties:
        status:          { type: string, enum: [open, submitted, approved, denied, expired] }
        body:            { type: string }
        expires_at:      { type: string, format: date-time }
        resolution_note: { type: string }

    ExportStatus:
      type: object
      description: |
        Latest export-request status. `status: "none"` is returned when the
        user has never requested an export.
      properties:
        id:           { type: string, format: uuid }
        status:       { type: string, enum: [none, pending, processing, ready, failed, expired] }
        requested_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        expires_at:   { type: [string, "null"], format: date-time }

    AdminUser:
      type: object
      properties:
        id:       { type: string, format: uuid }
        email:    { type: string, format: email }
        username: { type: string }
        role:     { type: string, enum: [user, admin, super_admin] }
        status:   { type: string, enum: [active, suspended, deleted, purged] }
        created_at: { type: string, format: date-time }

    Channel:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: [string, "null"] }
        avatar_url:  { type: [string, "null"], format: uri }
        created_at:  { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not authorised.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit or account lockout.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

tags:
  - name: System
  - name: Auth
  - name: Account
  - name: Profiles
  - name: Contacts
  - name: Chat
  - name: Notifications
  - name: Presence
  - name: Uploads
  - name: Reports
  - name: Push
  - name: Admin

paths:

  # ── System ──────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:  { type: string, example: ok }
                  env:     { type: string }
                  version: { type: string }
                  db:      { type: string, enum: [ok, error] }
                  redis:   { type: string, enum: [ok, error] }

  # ── Auth ─────────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:       { type: string, format: email }
                password:    { type: string }
                remember_me:
                  type: boolean
                  default: false
                  description: |
                    When true the refresh token TTL is 30 days; when false it is 30 minutes.
      responses:
        "200":
          description: Successful login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Email not verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:         { type: string, format: email }
                password:      { type: string, minLength: 8, maxLength: 128 }
                username:      { type: string }
                date_of_birth: { type: string, format: date }
      responses:
        "201":
          description: Account created. Verification email sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Email or username already taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair. The old refresh token is invalidated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate refresh token)
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204":
          description: Logged out. Always succeeds even if token was already expired.

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Always 200 to prevent email enumeration.

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token from email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:    { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Password reset successfully.
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Email verified.
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Always 200 to prevent email enumeration.

  # ── Account ──────────────────────────────────────────────────────────────────

  /users/me/password:
    put:
      tags: [Account]
      summary: Change password
      description: Revokes all refresh tokens for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password:     { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Password updated.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me:
    delete:
      tags: [Account]
      summary: Delete account (soft, 30-day grace period)
      description: |
        Marks the account as deleted. The user has 30 days to log back in and
        restore it. After that the account is permanently purged. Revokes all
        refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204":
          description: Account scheduled for deletion.
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Profiles ─────────────────────────────────────────────────────────────────

  /profiles/available:
    get:
      tags: [Profiles]
      summary: Check username availability
      security: []
      parameters:
        - in: query
          name: username
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Availability result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }

  /profiles/me:
    get:
      tags: [Profiles]
      summary: Get my profile
      responses:
        "200":
          description: Current user's full profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Profiles]
      summary: Update my profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:      { type: string }
                display_name:  { type: string }
                bio:           { type: string }
                date_of_birth: { type: string, format: date }
                gender:        { type: string }
                interests:     { type: array, items: { type: string } }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/me/avatar:
    put:
      tags: [Profiles]
      summary: Update avatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_id]
              properties:
                upload_id: { type: string, format: uuid }
      responses:
        "200":
          description: Avatar updated.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/me/preferences:
    get:
      tags: [Profiles]
      summary: Get my preferences
      responses:
        "200":
          description: User preferences.
          content:
            application/json:
              schema:
                type: object
                properties:
                  locale:       { type: string }
                  push_enabled: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Profiles]
      summary: Update my preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:       { type: string, enum: [en, es, pt] }
                push_enabled: { type: boolean }
      responses:
        "200":
          description: Preferences updated.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/me/photos:
    post:
      tags: [Profiles]
      summary: Add profile photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_id]
              properties:
                upload_id: { type: string, format: uuid }
      responses:
        "201":
          description: Photo added.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/me/photos/{photoID}:
    delete:
      tags: [Profiles]
      summary: Delete profile photo
      parameters:
        - in: path
          name: photoID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Photo deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/browse:
    get:
      tags: [Profiles]
      summary: Browse profiles
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated profile list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/Profile" }
                  next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/interests:
    get:
      tags: [Profiles]
      summary: Search interests (autocomplete)
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200":
          description: Matching interest strings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  interests: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/{ref}:
    get:
      tags: [Profiles]
      summary: Get public profile by username or ID
      parameters:
        - in: path
          name: ref
          required: true
          schema: { type: string }
          description: Username or UUID.
      responses:
        "200":
          description: Public profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Contacts ─────────────────────────────────────────────────────────────────

  /users/search:
    get:
      tags: [Contacts]
      summary: Search users
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contacts:
    get:
      tags: [Contacts]
      summary: List accepted contacts
      responses:
        "200":
          description: Accepted contacts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Contacts]
      summary: Send contact request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressee_id]
              properties:
                addressee_id: { type: string, format: uuid }
      responses:
        "201":
          description: Request sent.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Request already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /contacts/pending:
    get:
      tags: [Contacts]
      summary: List incoming pending requests
      responses:
        "200":
          description: Pending incoming requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contacts/sent:
    get:
      tags: [Contacts]
      summary: List sent pending requests
      responses:
        "200":
          description: Sent pending requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contacts/blocked:
    get:
      tags: [Contacts]
      summary: List blocked users
      responses:
        "200":
          description: Blocked users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contacts/{id}/accept:
    put:
      tags: [Contacts]
      summary: Accept contact request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Request accepted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/{id}:
    delete:
      tags: [Contacts]
      summary: Remove contact or decline request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Contact removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/{id}/block:
    post:
      tags: [Contacts]
      summary: Block user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: User blocked.
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Contacts]
      summary: Unblock user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: User unblocked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Chat ─────────────────────────────────────────────────────────────────────

  /chat/rooms/dm:
    post:
      tags: [Chat]
      summary: Get or create DM room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_id]
              properties:
                peer_id: { type: string, format: uuid }
      responses:
        "200":
          description: Existing or newly created DM room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /chat/rooms:
    get:
      tags: [Chat]
      summary: List rooms (DMs + groups the user is a member of)
      responses:
        "200":
          description: Room list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Room" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Chat]
      summary: Create group room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string }
                description: { type: string }
                member_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Created group room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /chat/rooms/{id}:
    get:
      tags: [Chat]
      summary: Get room details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Room details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Chat]
      summary: Update group room (name / description / avatar)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:        { type: string }
                description: { type: string }
                upload_id:   { type: string, format: uuid }
      responses:
        "200":
          description: Updated room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/rooms/{id}/members:
    get:
      tags: [Chat]
      summary: List room members
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Member list.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:      { type: string, format: uuid }
                    username:     { type: string }
                    display_name: { type: string }
                    avatar_url:   { type: [string, "null"], format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Chat]
      summary: Add member to group room
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        "204":
          description: Member added.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/rooms/{id}/members/{userID}:
    delete:
      tags: [Chat]
      summary: Remove member from group room
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: userID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Member removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/rooms/{id}/messages:
    get:
      tags: [Chat]
      summary: List room messages (paginated, newest first)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: before
          schema: { type: string, format: date-time }
          description: Cursor — return messages older than this timestamp.
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Message page.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/rooms/{id}/read:
    put:
      tags: [Chat]
      summary: Mark room as read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Read receipt recorded.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /chat/rooms/{id}/messages/{msgID}/view:
    post:
      tags: [Chat]
      summary: View a view-once message (streams content then deletes it)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: msgID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File content streamed; message deleted after response.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/rooms/{id}/ws:
    get:
      tags: [Chat]
      summary: WebSocket — real-time chat
      description: |
        Upgrades the connection to WebSocket. Authentication is via `?token=<jwt>`
        query parameter (the browser WebSocket API does not support custom headers).

        **Client → server frames**
        ```json
        { "type": "message", "content": "hello" }
        { "type": "attachment", "content": "caption", "mime_type": "image/jpeg", "upload_id": "<uuid>" }
        { "type": "typing" }
        { "type": "ping" }
        ```

        **Server → client frames**
        ```json
        { "event": "message", ... }
        { "event": "typing", "user_id": "...", "username": "..." }
        { "event": "read_receipt", "room_id": "...", "user_id": "...", "read_at": "..." }
        { "event": "message_deleted", "id": "...", "room_id": "..." }
        { "event": "pong" }
        ```
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: token
          required: true
          schema: { type: string }
          description: Valid access JWT.
      responses:
        "101":
          description: Switching protocols — WebSocket connection established.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/channels:
    get:
      tags: [Chat]
      summary: List public channels
      responses:
        "200":
          description: Channel list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Chat]
      summary: Create channel (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string }
                description: { type: string }
      responses:
        "201":
          description: Channel created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Notifications ─────────────────────────────────────────────────────────────

  /notifications/stream:
    get:
      tags: [Notifications]
      summary: SSE stream — real-time notifications
      description: |
        Server-Sent Events stream. Authentication via `?token=<jwt>` query
        parameter (the browser `EventSource` API does not support custom headers).

        **Event types**
        - `new_message` — new chat message in a room the user is a member of
        - `contact_request` — incoming contact request
        - `contact_accepted` — a sent request was accepted
        - `presence` — a contact came online or went offline
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: SSE stream (text/event-stream).
          content:
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Presence ──────────────────────────────────────────────────────────────────

  /presence/heartbeat:
    post:
      tags: [Presence]
      summary: Mark user as online
      description: Should be called every 30 s. Sets TTL 60 s in Redis.
      responses:
        "204":
          description: Heartbeat recorded.
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Presence]
      summary: Mark user as offline immediately
      responses:
        "204":
          description: Presence cleared.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /presence:
    get:
      tags: [Presence]
      summary: Get presence for a list of users
      parameters:
        - in: query
          name: user_ids
          required: true
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: false
      responses:
        "200":
          description: Presence map.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    online:    { type: boolean }
                    last_seen: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Uploads ───────────────────────────────────────────────────────────────────

  /uploads/request:
    post:
      tags: [Uploads]
      summary: Request a pre-signed upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type]
              properties:
                content_type: { type: string, example: image/jpeg }
                filename:     { type: string }
      responses:
        "201":
          description: Pre-signed upload URL and upload ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /uploads/{id}/confirm:
    post:
      tags: [Uploads]
      summary: Confirm upload completed
      description: |
        Marks the upload as committed and triggers async image processing
        (EXIF strip, thumbnail, moderation pipeline). The client should poll
        `GET /uploads/{id}` to learn the moderation outcome.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Upload confirmed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /uploads/{id}:
    get:
      tags: [Uploads]
      summary: Get the owner-only view of an upload
      description: |
        Returns the full upload row (status, thumbnail, moderation outcome).
        Used by the frontend to poll for the moderation result after confirming
        — a `moderation_status` of `rejected` carries the human-readable
        `moderation_reason` to surface to the uploader.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Upload row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:                { type: string, format: uuid }
                  status:            { type: string, enum: [pending, committed, failed] }
                  moderation_status: { type: string, enum: [pending, approved, rejected, skipped] }
                  moderation_code:   { type: string }
                  moderation_reason: { type: string }
                  thumbnail_key:     { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/moderation:
    get:
      tags: [Moderation]
      summary: List rejected uploads (admin only)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Rejected uploads, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    upload_id:    { type: string, format: uuid }
                    user_id:      { type: string, format: uuid }
                    user_email:   { type: string, format: email }
                    storage_key:  { type: string }
                    filename:     { type: string }
                    content_type: { type: string }
                    size_bytes:   { type: integer }
                    code:         { type: string }
                    reason:       { type: string }
                    moderated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/moderation/hashes:
    post:
      tags: [Moderation]
      summary: Add a SHA-256 to the local block list (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash, reason]
              properties:
                hash:   { type: string, description: "Hex-encoded SHA-256 of the image bytes." }
                source: { type: string, default: local }
                reason: { type: string }
      responses:
        "204":
          description: Hash added (idempotent — re-adding the same hash is a no-op).
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Reports ───────────────────────────────────────────────────────────────────

  /reports:
    get:
      tags: [Reports]
      summary: List reports (admin only)
      description: |
        Returns reports ordered critical → high → normal, then newest-first.
        Filterable by status and priority.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, reviewed, dismissed] }
        - in: query
          name: priority
          schema: { type: string, enum: [normal, high, critical] }
      responses:
        "200":
          description: Report list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Reports]
      summary: Submit a report
      description: |
        Priority is derived server-side from the reason —
        `csam` and `non_consensual_intimate_images` are routed to the critical
        queue, `digital_gender_violence` (Ley Olimpia) to the high queue,
        everything else to normal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reported_user_id, reason]
              properties:
                reported_user_id: { type: string, format: uuid }
                reason:
                  type: string
                  enum:
                    - harassment
                    - spam
                    - inappropriate_content
                    - fake_profile
                    - non_consensual_intimate_images
                    - digital_gender_violence
                    - csam
                    - other
                description: { type: string }
      responses:
        "201":
          description: Report submitted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /reports/{id}/status:
    put:
      tags: [Reports]
      summary: Update report status (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [reviewed, dismissed] }
      responses:
        "200":
          description: Status updated.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Appeals ───────────────────────────────────────────────────────────────────
  # The public /appeal/{token} routes are intentionally un-authenticated — the
  # suspended user they serve cannot log in. Auth is provided by the single-use
  # 30-day token emailed at suspension time.

  /appeal/{token}:
    get:
      tags: [Appeals]
      summary: Fetch an appeal by token (un-authenticated)
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Appeal view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppealPublicView" }
        "404":
          description: Invalid or expired token.
    post:
      tags: [Appeals]
      summary: Submit an appeal statement (un-authenticated)
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 4096
      responses:
        "200":
          description: Appeal recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppealPublicView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Invalid or expired token.
        "409":
          description: Appeal already resolved.

  /admin/appeals:
    get:
      tags: [Appeals]
      summary: List appeals (admin only)
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, submitted, approved, denied, expired] }
      responses:
        "200":
          description: Appeal list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appeal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/appeals/{id}:
    put:
      tags: [Appeals]
      summary: Resolve an appeal (admin only)
      description: |
        Status `approved` reactivates the user. `denied` leaves the suspension
        in place. The user is emailed the outcome plus any note in either
        case.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, denied] }
                note:   { type: string }
      responses:
        "200":
          description: Appeal resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appeal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Appeal already resolved.

  # ── Data export (Habeas Data / GDPR Art. 20) ──────────────────────────────────
  # The public /account/export/{token} download is intentionally un-authenticated;
  # the single-use 14-day path token is the credential.

  /users/me/exports:
    post:
      tags: [Exports]
      summary: Request a data export
      description: |
        Enqueues an asynq build of the user's data export (machine-readable
        JSON plus media). The user is emailed a single-use download link
        once the build completes (14-day TTL). Rate-limited to one request
        per 24h; returns 409 if a build is already in flight.
      responses:
        "202":
          description: Export queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: An export is already being prepared.
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      tags: [Exports]
      summary: Latest export status
      description: |
        Returns the most recent export request, or `{status: "none"}` if the
        user has never requested one.
      responses:
        "200":
          description: Latest export status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/export/{token}:
    get:
      tags: [Exports]
      summary: Download an export by token (un-authenticated)
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Zip stream.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: Invalid or expired download token.
        "409":
          description: Export not ready yet.

  # ── Push notifications ────────────────────────────────────────────────────────

  /push/vapid-public-key:
    get:
      tags: [Push]
      summary: Get VAPID public key
      responses:
        "200":
          description: VAPID public key for Web Push subscription.
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /push/subscribe:
    post:
      tags: [Push]
      summary: Register push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  properties:
                    p256dh: { type: string }
                    auth:   { type: string }
      responses:
        "204":
          description: Subscription registered.
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Push]
      summary: Unregister push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        "204":
          description: Subscription removed.
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Admin ─────────────────────────────────────────────────────────────────────

  /admin/stats:
    get:
      tags: [Admin]
      summary: Platform statistics (admin only)
      responses:
        "200":
          description: Aggregated stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_users:   { type: integer }
                  active_users:  { type: integer }
                  total_rooms:   { type: integer }
                  total_messages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users:
    get:
      tags: [Admin]
      summary: List users (admin only)
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [active, suspended, deleted, purged] }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: User list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{id}/status:
    put:
      tags: [Admin]
      summary: Update user status (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        "200":
          description: Status updated.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}:
    delete:
      tags: [Admin]
      summary: Hard-delete user (super_admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: User permanently deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/role:
    put:
      tags: [Admin]
      summary: Set user role (super_admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [user, admin] }
      responses:
        "200":
          description: Role updated.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/channels:
    get:
      tags: [Admin]
      summary: List all channels (admin only)
      responses:
        "200":
          description: Channel list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create channel (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string }
                description: { type: string }
      responses:
        "201":
          description: Channel created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Channel name already taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/channels/{id}:
    put:
      tags: [Admin]
      summary: Update channel (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:        { type: string }
                description: { type: string }
      responses:
        "200":
          description: Channel updated.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin]
      summary: Delete channel (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Channel deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
